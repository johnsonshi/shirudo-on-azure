# Azure additions to shirudo's CI kernel profile (testing/kernel/kernel-ci*.conf).
#
# The CI profile already boots Ubuntu 26.04 with systemd, ext4, vfat, NVMe,
# dm-verity, the BPF LSM, ML-DSA and AF_ALG. It targets QEMU (virtio) and
# AWS (ENA), so it cannot see an Azure disk or NIC. These options add the
# Hyper-V guest drivers a Generation 2 Azure VM needs, built in so that no
# initramfs module is required to find the root disk.
CONFIG_LOCALVERSION="-shirudo-azure"

# VMBus, the channel every synthetic Hyper-V device sits on, and the
# integration services (time sync, KVP, heartbeat, shutdown, ballooning).
# The utilities talk to their userspace daemons through the connector.
CONFIG_HYPERV=y
CONFIG_HYPERV_VMBUS=y
CONFIG_CONNECTOR=y
CONFIG_HYPERV_UTILS=y
CONFIG_HYPERV_BALLOON=y

# The OS disk and the data disks are SCSI LUNs behind storvsc; the
# provisioning media is a SCSI DVD with a UDF filesystem.
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_BLK_DEV_SR=y
CONFIG_SCSI_FC_ATTRS=y
CONFIG_HYPERV_STORAGE=y
CONFIG_UDF_FS=y

# The synthetic NIC (netvsc). Accelerated networking stays off on the VM,
# so no Mellanox or MANA virtual function driver is needed.
CONFIG_HYPERV_NET=y

# EFI variables, so systemd and bootctl can read the boot entries.
CONFIG_EFIVAR_FS=y
